<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="IDENTITATIS — not what it knows, who it is">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8322b"/>
      <stop offset="0.55" stop-color="#e2622f"/>
      <stop offset="1" stop-color="#c8322b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2ece2"/>
      <stop offset="1" stop-color="#c9c2b6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="330" fill="#0a0a0c"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#edge)"/>

  <!-- the layers, drawn as what they are: files that stack -->
  <g opacity="0.30">
    <rect x="72" y="128" width="150" height="15" rx="2" fill="#c8322b"/>
    <rect x="72" y="152" width="112" height="15" rx="2" fill="#7a7268"/>
    <rect x="72" y="176" width="132" height="15" rx="2" fill="#7a7268"/>
    <rect x="72" y="200" width="86"  height="15" rx="2" fill="#4a463f"/>
  </g>

  <text x="270" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="72" letter-spacing="13" fill="url(#fade)" font-weight="700">IDENTITATIS</text>

  <rect x="272" y="180" width="132" height="2" fill="#c8322b"/>

  <text x="272" y="221" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="25" fill="#e8e2d8">Not what your agent knows.</text>
  <text x="272" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="25" fill="#e2622f" font-weight="600">Who it is.</text>

  <text x="272" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="15" fill="#6f6960" letter-spacing="2.5">FILES · NO RUNTIME · NO DEPENDENCIES · MIT</text>

  <text x="1128" y="296" text-anchor="end"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="15" fill="#4a463f" letter-spacing="2">TIA</text>
</svg>
